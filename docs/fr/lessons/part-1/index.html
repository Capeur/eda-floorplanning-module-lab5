<style>
/* lesson.css — styles for the animated lesson player (lesson-engine.js).
   Layout: one reading column. A 16:9 stage carries the lesson; captions and transport sit under it,
   then chapters and the "your turn" bench. Group colours follow the course labs: the group holding
   the first node name is blue, the next green, then amber and rose; cut edges are red. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17201c;
  --muted: #56625c;
  --line: #d6ddd8;
  --stage: #fbfcfa;
  --edge: #7a8780;
  --g0: #1d4ed8;
  --g1: #0f6b5c;
  --g2: #b45309;
  --g3: #9f1239;
  --cut: #dc2626;
  --heavy: #b45309;
  --copper: #a8662a;
  --unplaced: #94a3b8;
  --tint0: rgba(29, 78, 216, 0.07);
  --tint1: rgba(15, 107, 92, 0.08);
  --said: #17201c;
  --unsaid: #9aa49f;
  --mark: #fde68a;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #151d1a; --ink: #e6ece9; --muted: #9ba7a1; --line: #2a3531;
    --stage: #111916; --edge: #85938c; --g0: #6f8fff; --g1: #36b39b; --g2: #f59e0b; --g3: #fb7185;
    --cut: #f87171; --heavy: #f59e0b; --copper: #d39a5c; --unplaced: #66758a;
    --tint0: rgba(111, 143, 255, 0.10); --tint1: rgba(54, 179, 155, 0.10);
    --said: #e6ece9; --unsaid: #5f6b66; --mark: #78350f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --ink: #e6ece9; --muted: #9ba7a1; --line: #2a3531;
  --stage: #111916; --edge: #85938c; --g0: #6f8fff; --g1: #36b39b; --g2: #f59e0b; --g3: #fb7185;
  --cut: #f87171; --heavy: #f59e0b; --copper: #d39a5c; --unplaced: #66758a;
  --tint0: rgba(111, 143, 255, 0.10); --tint1: rgba(54, 179, 155, 0.10);
  --said: #e6ece9; --unsaid: #5f6b66; --mark: #78350f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px; margin: 0;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.lede a, .note a { color: inherit; }

/* ---------- player ---------- */
.player { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--stage); container-type: inline-size; overflow: hidden; }
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.ov { position: absolute; opacity: 0; will-change: opacity, transform; }
.ov [data-a] { display: inline-block; opacity: 0; }

.hl { font-family: var(--display); font-weight: 700; font-size: 4.3cqw; line-height: 1.08; letter-spacing: -0.01em; max-width: 60cqw; }
.hl b, .tag b, .sub b, .qcard b { color: var(--g0); font-weight: 700; }
.red { color: var(--cut); }
.sub { font-family: var(--body); font-size: 2.1cqw; color: var(--muted); font-weight: 600; margin-top: .6cqw; }
.term { display: grid; gap: .4cqw; background: var(--surface); border: 1px solid var(--line); border-radius: 1.2cqw; padding: 1.4cqw 1.8cqw; box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.06); }
.term .t { font-family: var(--display); font-size: 3.4cqw; font-weight: 700; }
.term .d { font-size: 1.9cqw; color: var(--muted); }
.chip { display: inline-block; font-family: var(--mono); font-size: 2.2cqw; font-weight: 500; padding: .5cqw 1.3cqw; border-radius: 99px; border: 2px solid var(--ink); background: var(--surface); }
.tag { font-family: var(--body); font-weight: 700; font-size: 2.2cqw; background: var(--surface); border: 1px solid var(--line); border-radius: .9cqw; padding: .6cqw 1.2cqw; }
.tags { display: grid; gap: 1cqw; justify-items: start; }
.tag .n, .num { font-family: var(--mono); color: var(--heavy); }
.label { font-family: var(--display); font-weight: 700; font-size: 2.8cqw; }
.label.c0 { color: var(--g0); } .label.c1 { color: var(--g1); } .label.c2 { color: var(--g2); } .label.c3 { color: var(--g3); }
.vocab { display: grid; gap: .8cqw; font-size: 2cqw; }
.vocab div { background: var(--surface); border: 1px solid var(--line); border-radius: .8cqw; padding: .5cqw 1.1cqw; }
.vocab b { font-family: var(--display); font-size: 2.3cqw; margin-right: .6cqw; }
.eq { font-family: var(--mono); font-size: 3.4cqw; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 1cqw; padding: 1cqw 1.6cqw; white-space: nowrap; }
.eq .red { font-weight: 700; }
.stamp { font-family: var(--display); font-weight: 700; font-size: 6cqw; color: var(--cut); border: .45cqw solid var(--cut); border-radius: 1cqw; padding: .2cqw 1.6cqw; rotate: -9deg; letter-spacing: .06em; text-transform: uppercase; background: color-mix(in srgb, var(--stage) 80%, transparent); }
.bigq { width: 100cqw; }
.bigq .q { font-family: var(--display); font-size: 16cqw; font-weight: 700; line-height: 1; color: var(--muted); text-align: center; }
.bigq .hl { max-width: none; text-align: center; font-size: 3.6cqw; }
.cmp { display: grid; gap: 1cqw; background: var(--surface); border: 1px solid var(--line); border-radius: 1.4cqw; padding: 2cqw 2.4cqw; width: 62cqw; box-shadow: 0 .8cqw 3cqw rgba(0,0,0,.08); }
.cmp .row { display: grid; grid-template-columns: 1.4fr .7fr 1.3fr; align-items: baseline; gap: 1.4cqw; font-size: 2.3cqw; }
.cmp .row .k { font-family: var(--mono); font-size: 3cqw; font-weight: 500; }
.cmp .bad .k { color: var(--cut); }
.cmp .good .k { color: var(--g1); }
.qcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 1.4cqw; padding: 1.6cqw 2.2cqw; width: 44cqw; display: grid; gap: .6cqw; }
.qcard .e { font-family: var(--mono); font-size: 1.7cqw; letter-spacing: .1em; text-transform: uppercase; color: var(--heavy); }
.qcard .q { font-family: var(--display); font-size: 3.1cqw; font-weight: 700; line-height: 1.15; }
.qcard .h { font-size: 1.8cqw; color: var(--muted); }
.qbtns { display: none; gap: 1cqw; pointer-events: auto; flex-wrap: wrap; }
.stage.asking .qbtns { display: flex; }
.qbtns .btn { font-size: 1.8cqw; padding: .6cqw 1.3cqw; }
.qans { color: var(--ink); font-size: 1.9cqw; }
.qans:empty { display: none; }
.thumbs { display: flex; gap: 2cqw; }
.thumb { background: var(--surface); border: 1px solid var(--line); border-radius: 1.2cqw; padding: 1cqw; display: grid; gap: .4cqw; justify-items: center; width: 22cqw; position: relative; }
.thumb svg { width: 100%; height: auto; display: block; }
.thumb .c { font-family: var(--mono); font-size: 1.75cqw; font-weight: 500; white-space: nowrap; }
.thumb.best { border: 2px solid var(--g1); }
.thumb .ok { position: absolute; top: -1.6cqw; right: -1.2cqw; background: var(--g1); color: #fff; font-weight: 700; font-size: 1.7cqw; border-radius: 99px; padding: .3cqw 1cqw; }

.counter { display: grid; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 1.2cqw; padding: .9cqw 1.6cqw; min-width: 15cqw; }
.counter .l, .balance .l { font-family: var(--mono); font-size: 1.6cqw; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.counter .v { font-family: var(--mono); font-size: 6.2cqw; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.counter.bad .v { color: var(--cut); }
.counter.good .v { color: var(--g1); }
.balance { display: grid; gap: .8cqw; background: var(--surface); border: 1px solid var(--line); border-radius: 1.2cqw; padding: 1.2cqw 1.6cqw; width: 19cqw; }
.bars { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1.6cqw; height: 15cqw; align-items: end; }
.bar { background: var(--g0); border-radius: .5cqw .5cqw 0 0; height: 0; display: flex; justify-content: center; align-items: flex-start; color: #fff; font-family: var(--mono); font-size: 2cqw; padding-top: .3cqw; }
.bar.c1 { background: var(--g1); } .bar.c2 { background: var(--g2); } .bar.c3 { background: var(--g3); }
.cap { position: absolute; left: -.6cqw; right: -.6cqw; height: 0; border-top: .3cqw dashed var(--cut); opacity: 0; }
.cap span { position: absolute; right: 0; top: -2.6cqw; font-family: var(--mono); font-size: 1.5cqw; color: var(--cut); }
.verdict { font-weight: 700; font-size: 1.9cqw; min-height: 1.2em; }
.verdict.no { color: var(--cut); }
.verdict.yes { color: var(--g1); }
.banner { position: absolute; left: 2cqw; top: 2cqw; display: none; gap: 1cqw; align-items: center; pointer-events: auto; font-size: 1.9cqw; }
.stage.free .banner { display: flex; }
.banner b { font-family: var(--display); font-size: 2.6cqw; }

/* svg pieces */
.node rect { transition: fill .45s, stroke .45s; }
.g0 rect { fill: var(--g0); stroke: var(--g0); }
.g1 rect { fill: var(--g1); stroke: var(--g1); }
.g2 rect { fill: var(--g2); stroke: var(--g2); }
.g3 rect { fill: var(--g3); stroke: var(--g3); }
.nu rect { fill: var(--unplaced); stroke: var(--unplaced); }
.ncell rect { fill: var(--surface); stroke: var(--copper); stroke-width: 3; }
.node text { fill: #fff; font-family: var(--body); font-weight: 700; font-size: 21px; text-anchor: middle; dominant-baseline: central; }
.ncell text { fill: var(--ink); }
.node { cursor: pointer; }
.node:focus-visible rect { stroke: var(--ink); stroke-width: 4; }
.main { stroke: var(--edge); stroke-linecap: round; transition: stroke .35s; }
.wire { stroke: var(--copper); stroke-width: 2.2; stroke-linecap: round; }
.edge.cut .main { stroke: var(--cut); stroke-dasharray: 10 7; }
.edge.heavy .main { stroke: var(--heavy); }
.edge.pulse .main { animation: lesson-pulse 1s ease-in-out 2; }
@keyframes lesson-pulse { 50% { stroke-width: 12; } }
.wl rect { fill: var(--stage); stroke: var(--line); transition: fill .3s, stroke .3s; }
.wl text { fill: var(--ink); font-family: var(--mono); font-size: 16px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.edge.cut .wl rect { stroke: var(--cut); }
.edge.flash .wl rect { fill: var(--mark); stroke: var(--heavy); }
.chipbody { fill: none; stroke: var(--copper); stroke-width: 3; }
.pin { fill: var(--copper); }
.divider { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 8 8; }
.tint0 { fill: var(--tint0); }
.tint1 { fill: var(--tint1); }

/* captions */
.captions { padding: 14px 18px; border-top: 1px solid var(--line); min-height: 3.6em; font-size: 19px; line-height: 1.45; }
.captions span { color: var(--unsaid); transition: color .15s; }
.captions span.said { color: var(--said); }
.player.nocc .captions { display: none; }

/* transport */
.transport { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center; padding: 12px 16px 14px; border-top: 1px solid var(--line); }
.play { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 18px; cursor: pointer; display: grid; place-items: center; }
.scrub { display: grid; gap: 4px; min-width: 0; }
.scrub input { width: 100%; accent-color: var(--g0); }
.time { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button, .tbtn { font-family: var(--mono); font-size: 13px; padding: 6px 9px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tbtn { border: 1px solid var(--line); border-radius: 8px; }
.tbtn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--g0); outline-offset: 2px; }
@media (max-width: 620px) {
  .transport { grid-template-columns: auto 1fr; }
  .opts { grid-column: 1 / -1; justify-content: flex-start; }
  .captions { font-size: 16px; }
}

/* chapters + bench */
.chapters { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chapters button { width: 100%; display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; text-align: left; background: none; border: 0; border-left: 3px solid var(--line); padding: 6px 12px; font: inherit; color: var(--muted); cursor: pointer; }
.chapters button .ts { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.chapters button[aria-current="true"] { border-left-color: var(--g0); color: var(--ink); font-weight: 600; }
.cols { display: grid; grid-template-columns: 1fr 1.25fr; gap: 22px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
h2 { font-family: var(--display); font-size: 24px; margin: 0 0 8px; }
.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.bench.pulse { animation: lesson-benchin 1.2s ease 2; }
@keyframes lesson-benchin { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--g0) 35%, transparent); } }
.bench p { margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 15px var(--body); padding: 8px 14px; border-radius: 9px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.seedbox { width: 5.5em; font: 500 15px var(--mono); padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.feedback { border-left: 3px solid var(--g1); padding: 4px 0 4px 12px; }
.feedback:empty { display: none; }
.readout { font-family: var(--mono); font-size: 14.5px; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; }
.ok { color: var(--g1); font-weight: 700; } .no { color: var(--cut); font-weight: 700; }
.norec .node rect, .norec .main, .norec .wl rect { transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .node rect, .main, .wl rect, .captions span { transition: none !important; }
  .edge.pulse .main, .bench.pulse { animation: none; }
}

/* ---------- floorplan scene (B*-tree + floor of blocks) ----------
   Block colours come from the lab (one fixed colour per block id, the course's paper palette) and are set inline.
   Tree links: left child = solid ("next door"), right child = dashed ("upstairs"). The skyline is amber. */
:root { --sky: #d97706; --waste: rgba(220, 38, 38, 0.10); --over: rgba(220, 38, 38, 0.13); --gridline: #e3e8e4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky: #fbbf24; --waste: rgba(248, 113, 113, 0.14); --over: rgba(248, 113, 113, 0.16); --gridline: #1f2a26; } }
:root[data-theme="dark"] { --sky: #fbbf24; --waste: rgba(248, 113, 113, 0.14); --over: rgba(248, 113, 113, 0.16); --gridline: #1f2a26; }
.fp-gridlines line { stroke: var(--gridline); stroke-width: 1; }
.fp-outline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 9 6; opacity: .55; }
.fp-outline-lab { font-family: var(--mono); font-size: 14px; fill: var(--muted); text-anchor: end; }
.fp-floorline { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.fp-axis text { font-family: var(--mono); font-size: 12.5px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.fp-axis .fp-axis-y { text-anchor: end; }
.fp-overzone { fill: url(#fp-over); stroke: none; transition: opacity .3s; }
.fp-over-line { stroke: var(--cut); stroke-width: 2.4; opacity: .55; }
.fp-hatch-bg { fill: var(--waste); }
.fp-hatch-line { stroke: var(--cut); stroke-width: 2; opacity: .35; }
.fp-waste { fill: url(#fp-hatch); }
.fpb rect { stroke-width: 2; fill-opacity: .92; }
.fpb .fp-bid { fill: #fff; font-family: var(--body); font-weight: 700; font-size: 21px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.fpb .fp-dim { fill: #fff; font-family: var(--mono); font-size: 12.5px; text-anchor: middle; dominant-baseline: central; opacity: .9; pointer-events: none; }
.fpb.out rect { stroke: var(--cut); stroke-width: 4; stroke-dasharray: 7 4; }
.fpb.hl rect, .fpn.hl circle:not(.fp-ring) { stroke: var(--ink); stroke-width: 4; }
.fp-sky { fill: none; stroke: var(--sky); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
.fp-bbox { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 10 6; }
.fp-bboxlab rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.fp-bboxlab text { font-family: var(--mono); font-size: 15px; font-weight: 500; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.fp-coords circle { fill: var(--ink); }
.fp-coords text { font-family: var(--mono); font-size: 13px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--stage); stroke-width: 4px; }
.fp-edge { stroke: var(--edge); stroke-width: 3; stroke-linecap: round; }
.fp-edge.right { stroke-dasharray: 8 6; }
.fpn circle { stroke-width: 3; }
.fpn .fp-ring { fill: none; stroke: var(--ink); stroke-width: 3; opacity: 0; }
.fpn.hl .fp-ring { opacity: 1; }
.fpn text { font-family: var(--body); font-weight: 700; font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.fpk { cursor: pointer; }
.fpk:focus-visible { outline: none; }
.fpk:focus-visible rect, .fpk:focus-visible circle:not(.fp-ring) { stroke: var(--ink); stroke-width: 4; }
.fp-badges circle { fill: var(--ink); }
.fp-badges text { fill: var(--bg); font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.fp-link rect { fill: var(--surface); stroke: var(--line); }
.fp-link text { font-family: var(--body); font-size: 13px; font-weight: 600; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.fp-legal { font-family: var(--body); font-weight: 700; font-size: 1.9cqw; background: var(--surface); border: 2px solid var(--line); border-radius: .9cqw; padding: .4cqw 1.1cqw; white-space: nowrap; }
.fp-legal.yes { color: var(--g1); border-color: var(--g1); }
.fp-legal.no { color: var(--cut); border-color: var(--cut); }
.fp-counter { min-width: 17cqw; }
.fp-thumb svg { max-height: 16cqw; }
.fp-ops .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.norec .fp-overzone { transition: none !important; }

</style>
</head>
<body>
<div id="lesson-root"></div>
<audio id="lesson-audio" preload="auto" src="lesson-fr.m4a"></audio>
<script>
/* lesson-engine.js (v4) — animated, narrated lesson player for eda-learning labs.
 *
 * LessonEngine.mount({ sb, timing, lang, audioId?, rootId?, ui?, storageKey? })
 *   sb      storyboard (see reference/storyboard.md). sb.scene picks what is drawn on the stage:
 *             "graph"     (default) nodes, weighted edges, splits, cut counter, balance bars   (partitioning labs)
 *             "floorplan" a B*-tree next to a floor of rectangles: blocks drop in walk order onto the skyline,
 *                         swap / turn / move, bounding box, wasted squares, fits-the-outline     (floorplanning labs)
 *   timing  { lang, duration, sentences: [{ slide, text, start, end, words: [{ w, t }] }] }
 *           made by scripts/voice_build.py (edge-tts word timings) or scripts/timing_from_vtt.py
 *   lang    "en" | "fr": picks the anchor word and the text of every overlay
 *
 * Everything on screen is a pure function of the audio time t, so seeking, speed changes and frame-by-frame
 * recording all show the same picture. A new key in a track starts from wherever the previous move had got to
 * (no jumps). window.__lesson exposes the internals the checker uses.
 *
 * Layout of this file: helpers · mount() = the core (timing, anchors, tracks, show windows, overlays, captions,
 * transport, question, diagnostics) · SCENES.graph · SCENES.floorplan. A scene gets a context object `cx` from the
 * core and returns hooks (see "scene contract" in mount).
 */
(function () {
  "use strict";

  const I18N = {
    en: {
      play: "Play", pause: "Pause", position: "Position in the lesson", speed: "Playback speed", captions: "CC",
      chapters: "Chapters", yourSplit: "Your split", back: "Back to the lesson",
      paused: "Paused. You are building your own split.", turn: "Pause and guess",
      deal: "Deal a random split with seed", dealBtn: "Deal",
      clickHint: "Or click the nodes on the stage to move them from one side to the other.",
      noSplit: "No split yet. Deal a seed or click a node.", noSplitNoDeal: "No split yet. Click a node to start.",
      backMsg: "Back in the lesson. Click a node to try again.",
      cut: "cut", sides: "sides", legal: "legal", notLegal: "not legal: at most {cap} per side",
      toPlace: "still to place: {list}", cutsize: "cutsize", perSide: "cells per side", max: "max {cap}",
      think: "Take a moment to think, then pick one.", seed: "Seed {s}: ", yours: "Your split: ",
      cell: "Cell {n}: click to move it to the other side", lesson: "Animated lesson", graph: "Graph",
      verdictYes: "legal", verdictNo: "not legal",
      // floorplan scene
      fpStage: "B*-tree and floorplan", yourTree: "Your tree", fpPaused: "Paused. You are changing the tree.",
      fpHint: "Pick a move, then click the blocks (on the floor or in the tree).",
      fpStart: "Click a block to start. The lesson pauses while you try.",
      fpBack: "Back in the lesson. Click a block to try again.",
      opSwap: "Swap two", opTurn: "Turn one", opMove: "Move a leaf", opReset: "Start again",
      pickSecond: "{a} picked. Click the block to swap it with.", swapped: "Swapped {a} and {b}. ",
      turned: "Turned {a}. ", pickLeaf: "{a} has children: pick a leaf (a block with no child).",
      pickTarget: "{a} picked. Click the block it should hang from.", moved: "Moved {a} under {b} ({side}). ",
      noSlot: "{b} has no free slot. Pick another block.", sameBlock: "That is the same block.",
      tree: "tree", box: "bounding box", wasted: "wasted", fits: "fits the {w} × {h} outline",
      sticks: "sticks out of the {w} × {h} outline", sideLeft: "next door", sideRight: "upstairs",
      nextDoor: "next door", upstairs: "upstairs", blockAria: "Block {n}: click to use it in your move",
      mArea: "bounding box", mWidth: "width", mHeight: "height", mWasted: "wasted squares", mX: "{n}.x", mY: "{n}.y",
    },
    fr: {
      play: "Lecture", pause: "Pause", position: "Position dans la leçon", speed: "Vitesse de lecture", captions: "ST",
      chapters: "Chapitres", yourSplit: "Votre partition", back: "Revenir à la leçon",
      paused: "En pause. Vous construisez votre propre partition.", turn: "Faites une pause et devinez",
      deal: "Distribuer une partition au hasard avec la graine", dealBtn: "Distribuer",
      clickHint: "Ou cliquez sur les nœuds de la scène pour les changer de côté.",
      noSplit: "Pas encore de partition. Distribuez une graine ou cliquez sur un nœud.",
      noSplitNoDeal: "Pas encore de partition. Cliquez sur un nœud pour commencer.",
      backMsg: "De retour dans la leçon. Cliquez sur un nœud pour réessayer.",
      cut: "coupe", sides: "côtés", legal: "valide", notLegal: "non valide : {cap} au plus par côté",
      toPlace: "reste à placer : {list}", cutsize: "taille de coupe", perSide: "cellules par côté", max: "max {cap}",
      think: "Prenez un moment pour réfléchir, puis choisissez.", seed: "Graine {s} : ", yours: "Votre partition : ",
      cell: "Cellule {n} : cliquez pour la changer de côté", lesson: "Leçon animée", graph: "Graphe",
      verdictYes: "valide", verdictNo: "non valide",
      fpStage: "Arbre B* et plan de masse", yourTree: "Votre arbre", fpPaused: "En pause. Vous modifiez l'arbre.",
      fpHint: "Choisissez un geste, puis cliquez sur les blocs (au sol ou dans l'arbre).",
      fpStart: "Cliquez sur un bloc pour commencer. La leçon se met en pause pendant l'essai.",
      fpBack: "De retour dans la leçon. Cliquez sur un bloc pour réessayer.",
      opSwap: "Échanger deux", opTurn: "Tourner un bloc", opMove: "Déplacer une feuille", opReset: "Recommencer",
      pickSecond: "{a} choisi. Cliquez sur le bloc à échanger avec lui.", swapped: "{a} et {b} échangés. ",
      turned: "{a} tourné. ", pickLeaf: "{a} a des enfants : choisissez une feuille (un bloc sans enfant).",
      pickTarget: "{a} choisi. Cliquez sur le bloc auquel l'accrocher.", moved: "{a} accroché sous {b} ({side}). ",
      noSlot: "{b} n'a plus de place libre. Choisissez un autre bloc.", sameBlock: "C'est le même bloc.",
      tree: "arbre", box: "boîte englobante", wasted: "perdu", fits: "tient dans le contour {w} × {h}",
      sticks: "dépasse du contour {w} × {h}", sideLeft: "à côté", sideRight: "à l'étage",
      nextDoor: "à côté", upstairs: "à l'étage", blockAria: "Bloc {n} : cliquez pour l'utiliser dans votre geste",
      mArea: "boîte englobante", mWidth: "largeur", mHeight: "hauteur", mWasted: "cases perdues", mX: "{n}.x", mY: "{n}.y",
    },
  };

  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const ease = (p) => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (w) => w.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  /** Keys a spoken word can be matched by: the whole word, and the part after an apostrophe (l'arête → arete). */
  const wordKeys = (w) => { const k = [norm(w)]; const m = w.split(/['’]/); if (m.length > 1) k.push(norm(m[m.length - 1])); return k; };
  const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));

  const FULL = [0, 0, 960, 540];
  const DUR_CAM = 1.3, DUR_DIM = 0.6;
  const SCENES = {};

  function mount(cfg) {
    const sb = cfg.sb, TM = cfg.timing, lang = cfg.lang || "en";
    const T = Object.assign({}, I18N[lang] || I18N.en, cfg.ui || {});
    const L = (v) => (v == null ? "" : typeof v === "string" ? v : v[lang] != null ? v[lang] : v.en != null ? v.en : "");
    const errors = [];
    const err = (m) => { errors.push(m); console.error("[lesson] " + m); };
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const D = reduce ? 0.001 : 1;
    const sceneName = sb.scene || "graph";

    /* ---------------- timing ---------------- */
    const SENT = TM.sentences.map((s) => {
      const words = s.words.map((w) => ({ w: w.w, t: w.t, keys: wordKeys(w.w) }));
      words.forEach((w, i) => { w.e = i + 1 < words.length ? words[i + 1].t : s.end; });
      return Object.assign({}, s, { words });
    });
    const DUR = TM.duration;
    const slideSents = (n) => SENT.filter((s) => s.slide === n);

    function findWords(obj, label) {
      const needle = obj[lang] != null ? obj[lang] : null;
      if (needle == null) { err(`anchor ${label}: no "${lang}" word given`); return null; }
      const [phrase, nthTxt] = String(needle).split("#");
      const nth = nthTxt != null ? parseInt(nthTxt, 10) : obj.nth || 0;
      const toks = phrase.split(/\s+/).map(norm).filter(Boolean);
      const pool = obj.slide != null ? slideSents(obj.slide) : SENT;
      if (!pool.length) { err(`anchor ${label}: slide ${obj.slide} has no narration in this part`); return null; }
      const ws = pool.flatMap((s) => s.words);
      let hit = 0;
      for (let i = 0; i + toks.length <= ws.length; i++) {
        if (toks.every((tk, j) => ws[i + j].keys.some((k) => k.startsWith(tk)))) {
          if (hit++ === nth) return { first: ws[i], last: ws[i + toks.length - 1] };
        }
      }
      err(`anchor ${label}: "${needle}" not found in slide ${obj.slide} (${lang}). Words: ${ws.map((w) => w.w).join(" ")}`);
      return null;
    }
    const anchorCache = new Map();
    function resolve(ref, label = "") {
      if (ref == null) return 0;
      if (typeof ref === "number") return ref;
      const key = typeof ref === "string" ? ref : JSON.stringify(ref);
      if (anchorCache.has(key)) return anchorCache.get(key);
      let t = 0;
      if (typeof ref === "string") {
        const m = ref.trim().match(/^(@[\w-]+|slide:\d+(?::end)?|end|start)\s*(?:([+-])\s*([\d.]+))?$/);
        if (!m) { err(`bad time reference "${ref}" ${label}`); return 0; }
        const shift = m[2] ? (m[2] === "-" ? -1 : 1) * parseFloat(m[3]) : 0;
        const base = m[1];
        if (base[0] === "@") {
          const a = sb.anchors && sb.anchors[base.slice(1)];
          if (!a) { err(`unknown anchor ${base} ${label}`); t = 0; } else t = resolveObj(a, base);
        } else if (base === "end") t = DUR;
        else if (base === "start") t = 0;
        else {
          const [, n, e] = base.split(":");
          const ss = slideSents(+n);
          if (!ss.length) err(`slide ${n} has no narration in this part ${label}`);
          else t = e ? ss[ss.length - 1].end : ss[0].start;
        }
        t += shift;
      } else t = resolveObj(ref, label);
      anchorCache.set(key, t);
      return t;
    }
    function resolveObj(o, label) {
      const hit = findWords(o, label);
      if (!hit) { const ss = o.slide != null ? slideSents(o.slide) : []; return (ss[0] ? ss[0].start : 0) + (o.shift || 0); }
      return (o.edge === "end" ? hit.last.e : hit.first.t) + (o.shift || 0);
    }

    /* ---------------- text markup: {piece@ref} appears at its own time, **x** accent, !!x!! red, ##x## number --- */
    function md(s) {
      let h = esc(s);
      h = h.replace(/\{([^{}@]+)@([^{}]+)\}/g, (m, piece, ref) => {
        ref = ref.trim();
        if (!/^(slide:|start|end|@)/.test(ref)) ref = "@" + ref; // {piece@name} means the anchor @name
        return `<span data-a="${resolve(ref, `(text "${piece}")`).toFixed(3)}">${piece}</span>`;
      });
      h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/!!(.+?)!!/g, '<span class="red">$1</span>').replace(/##(.+?)##/g, '<span class="num">$1</span>');
      return h;
    }

    /* ---------------- scene contract ----------------
     * SCENES[name](cx) returns {
     *   tracks: { name: { init, conv(v)->value, dur, mix(a,b,p)|null (null = step track) } }   (in key order)
     *   claims: [{ claim, got, ok }]
     *   ready()                          after tracks and show windows exist (cx.track, cx.seg, cx.win are usable)
     *   svgLabel, bannerText, pausedText
     *   benchHtml()                      HTML of the "your turn" box below the question (must hold .readout)
     *   buildSvg()                       draw the scene's SVG under the overlays
     *   buildWidgets()                   counters etc. on top of the overlays (cx.widget)
     *   render(t, free)                  draw the scene at time t (free = the scene's own try-it state or null)
     *   bindBench()                      wire the bench buttons and stage clicks
     *   thumb(item)                      HTML for one "thumbs" overlay item
     *   boxes(stageRect, sx, sy, cam)    [{ kind: "node", label, x, y, w, h }] of what text must not cover
     *   freeCamera                       camera used while the learner tries (default FULL)
     *   leaveFree()                      called when the lesson resumes
     * } */
    const cx = { sb, lang, T, L, err, resolve, md, esc, fill, D, reduce, lerp, ease, clamp, FULL, FREE: null };
    if (!SCENES[sceneName]) { err(`unknown scene "${sceneName}"`); }
    const scene = (SCENES[sceneName] || SCENES.graph)(cx);
    const claims = scene.claims || [];

    /* ---------------- tracks ---------------- */
    const cam = (v) => {
      if (v == null || v === "full") return FULL;
      const c = sb.cameras && sb.cameras[v] != null ? sb.cameras[v] : v;
      if (!Array.isArray(c) || c.length !== 3) { err(`bad camera ${JSON.stringify(v)}`); return FULL; }
      const [cxx, cy, w0] = c, w = Math.min(w0, 960), h = (w * 9) / 16;
      return [clamp(cxx - w / 2, 0, 960 - w), clamp(cy - h / 2, 0, 540 - h), w, h]; // a shot never shows past the scene
    };
    const mixArr = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
    cx.mixArr = mixArr;
    const SPEC = Object.assign({}, scene.tracks);
    // camera and dim are common to every scene; keep the scene's order (it decides the checker's report order)
    if (!SPEC.camera) SPEC.camera = { init: "full", conv: cam, dur: DUR_CAM, mix: mixArr };
    if (!SPEC.dim) SPEC.dim = { init: 1, conv: (v) => +v, dur: DUR_DIM, mix: lerp };
    for (const k of Object.keys(SPEC)) if (SPEC[k].conv === "camera") SPEC[k].conv = cam;
    const init = {};
    for (const k of Object.keys(SPEC)) init[k] = SPEC[k].init;
    Object.assign(init, sb.initial || {});
    const tracks = {};
    for (const k of Object.keys(SPEC)) tracks[k] = [[0, SPEC[k].conv(init[k]), "initial"]];
    (sb.timeline || []).forEach((item, i) => {
      const t = resolve(item.at, `(timeline #${i})`);
      let used = false;
      for (const k of Object.keys(SPEC)) if (k in item) { tracks[k].push([t, SPEC[k].conv(item[k]), item.at]); used = true; }
      for (const k of Object.keys(item)) if (k !== "at" && !(k in SPEC)) err(`timeline #${i}: unknown key "${k}" for the ${sceneName} scene`);
      if (!used) err(`timeline #${i}: nothing to change`);
    });
    for (const k of Object.keys(tracks)) tracks[k].sort((a, b) => a[0] - b[0]);

    const memo = new Map();
    function sampler(name, dur, mix) {
      if (memo.has(name)) return memo.get(name);
      const list = tracks[name], startVal = [];
      const valAt = (t) => {
        let i = -1;
        for (let k = 0; k < list.length; k++) { if (list[k][0] <= t) i = k; else break; }
        if (i <= 0) return list[0][1];
        if (startVal[i] === undefined) startVal[i] = valAt(list[i][0] - 1e-6);
        return mix(startVal[i], list[i][1], ease((t - list[i][0]) / (dur * D)));
      };
      memo.set(name, valAt);
      return valAt;
    }
    /** A track's value at t (interpolated), or for step tracks the segment { cur, prev, t0, i }. */
    cx.track = (name) => sampler(name, SPEC[name].dur, SPEC[name].mix);
    cx.seg = (name, t) => {
      const list = tracks[name]; let i = 0;
      for (let k = 0; k < list.length; k++) if (list[k][0] <= t) i = k;
      return { cur: list[i][1], prev: i > 0 ? list[i - 1][1] : list[i][1], t0: list[i][0], i };
    };
    cx.keys = (name) => tracks[name];
    const camAt = cx.track("camera");

    /* ---------------- show windows ---------------- */
    const WIN = {};
    (sb.show || []).forEach((w, i) => {
      const a = resolve(w.from, `(show ${w.show} #${i})`), b = w.to == null ? 1e9 : resolve(w.to, `(show ${w.show} #${i})`);
      if (b <= a) err(`show ${w.show} #${i}: ends (${b.toFixed(2)}s) before it starts (${a.toFixed(2)}s)`);
      (WIN[w.show] = WIN[w.show] || []).push(Object.assign({}, w, { a, b, edges: (w.edges || []).map((e) => e.replace(/\s/g, "")), stagger: w.stagger || 0 }));
    });
    cx.WIN = WIN;
    cx.win = (name, t) => (WIN[name] || []).find((w) => t >= w.a && t < w.b);
    cx.wins = (name, t) => (WIN[name] || []).filter((w) => t >= w.a && t < w.b);
    if (scene.ready) scene.ready();

    /* ---------------- DOM ---------------- */
    const root = document.getElementById(cfg.rootId || "lesson-root");
    const qa = sb.question;
    root.innerHTML = `
<div class="wrap">
  <header>
    <div class="eyebrow">${esc(L(sb.eyebrow))}</div>
    <h1>${esc(L(sb.title))}</h1>
    ${sb.lede ? `<p class="lede">${L(sb.lede)}</p>` : ""}
  </header>
  <section class="player" aria-label="${esc(T.lesson)}">
    <div class="stage scene-${esc(sceneName)}">
      <svg class="scene" viewBox="0 0 960 540" role="img" aria-label="${esc(scene.svgLabel || T.graph)}"></svg>
      <div class="layer"></div>
      <div class="banner"><b>${esc(scene.bannerText || T.yourSplit)}</b><button class="btn" type="button" data-act="back">${esc(T.back)}</button></div>
    </div>
    <div class="captions" aria-live="off"></div>
    <div class="transport">
      <button class="play" type="button" aria-label="${esc(T.play)}">▶</button>
      <div class="scrub"><input type="range" min="0" max="${DUR}" step="0.01" value="0" aria-label="${esc(T.position)}"><div class="time">0:00 / ${fmt(DUR)}</div></div>
      <div class="opts"><div class="seg" role="group" aria-label="${esc(T.speed)}"></div><button class="tbtn" type="button" aria-pressed="true">${esc(T.captions)}</button></div>
    </div>
  </section>
  <div class="cols">
    <section aria-label="${esc(T.chapters)}"><h2>${esc(T.chapters)}</h2><ul class="chapters"></ul></section>
    <section class="bench" aria-label="${esc(T.turn)}">
      <h2>${esc(T.turn)}</h2>
      ${qa ? `<p>${md(L(qa.text))}</p><div class="row bench-opts"></div><p class="feedback"></p>` : ""}
      ${scene.benchHtml()}
    </section>
  </div>
  ${sb.note ? `<p class="note">${L(sb.note)}</p>` : ""}
</div>`;
    const $ = (sel) => root.querySelector(sel);
    const stage = $(".stage"), svg = $("svg.scene"), layer = $(".layer");
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs = {}, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
    Object.assign(cx, { root, $, stage, svg, layer, mk, NS });
    scene.buildSvg();

    const BUILD = {
      headline: (o) => `<div class="hl"${o.size ? ` style="font-size:${+o.size}cqw"` : ""}>${md(L(o.text))}</div>${o.sub ? `<div class="sub">${md(L(o.sub))}</div>` : ""}`,
      term: (o) => `<div class="term"><span class="t">${md(L(o.text))}</span><span class="d">${md(L(o.sub))}</span></div>`,
      chip: (o) => `<span class="chip">${md(L(o.text))}</span>`,
      tag: (o) => `<div class="tag">${md(L(o.text))}</div>`,
      tags: (o) => `<div class="tags">${o.items.map((it) => `<div class="tag"${it.at ? ` data-a="${resolve(it.at, "(tags)").toFixed(3)}"` : ""}>${md(L(it.text))}</div>`).join("")}</div>`,
      label: (o) => `<span class="label c${o.color || 0}">${md(L(o.text))}</span>`,
      vocab: (o) => `<div class="vocab">${o.items.map((it) => `<div${it.at ? ` data-a="${resolve(it.at, "(vocab)").toFixed(3)}"` : ""}><b>${esc(L(it.k))}</b>${md(L(it.text))}</div>`).join("")}</div>`,
      eq: (o) => `<div class="eq">${md(L(o.text))}</div>`,
      stamp: (o) => `<div class="stamp">${md(L(o.text))}</div>`,
      bigq: (o) => `<div class="bigq"><div class="q">?</div><div class="hl">${md(L(o.text))}</div></div>`,
      compare: (o) => `<div class="cmp">${o.rows.map((r) => `<div class="row ${r.tone || ""}"><span>${md(L(r.label))}</span><span class="k">${md(L(r.value))}</span><span>${md(L(r.note))}</span></div>`).join("")}</div>`,
      thumbs: (o) => `<div class="thumbs">${o.items.map((it) => scene.thumb(it)).join("")}</div>`,
      question: () => `<div class="qcard"><span class="e">${esc(T.turn)}</span><span class="q">${md(L(qa && qa.text))}</span><span class="h qh">${esc(L(qa && qa.hint) || T.think)}</span><span class="qbtns">${(qa ? qa.options : []).map((op, i) => `<button class="btn" type="button" data-q="${i}">${esc(L(op.label))}</button>`).join("")}</span><span class="h qans"></span></div>`,
      html: (o) => L(o.html),
    };
    const OV = (sb.overlays || []).map((o, i) => {
      const lab = `(overlay #${i} ${o.type})`;
      const a = resolve(o.from, lab), b = o.to == null ? 1e9 : resolve(o.to, lab);
      if (b <= a) err(`overlay #${i} (${o.type}) ends (${b.toFixed(2)}s) before it starts (${a.toFixed(2)}s)`);
      const d = document.createElement("div");

  /* =====================================================================================================

        if (!(n in asn)) err(`split "${s}": unknown node ${n}`); else asn[n] = gi;

    }
    /** Colour rank of each group: the group holding the first node name is 0 (blue), and so on. */
    function colourOf(asn) {
      const firsts = new Map();

    const S = {

      benchHtml() {

      const names = { swap: T.opSwap, turn: T.opTurn, move: T.opMove };
      return `<div class="row fp-ops" role="group">${OPS.map((o) => `<button class="btn" type="button" data-op="${o}" aria-pressed="${o === mode}">${esc(names[o] || o)}</button>`).join("")}<button class="btn" type="button" data-act="fp-reset">${esc(T.opReset)}</button></div>
      <p>${esc(T.fpHint)}</p>

    }
    function describe(st, prefix) {
      return `${esc(prefix)}${esc(T.tree)} <b>${esc(st.str)}</b>${st.rot.size ? ` (${[...st.rot].join(", ")} ↻)` : ""}<br>${esc(T.box)} ${st.bbox[0]} × ${st.bbox[1]} = <b>${st.area}</b> · ${esc(T.wasted)} ${st.wasted} · ` +
        (st.legal ? `<span class="ok">${esc(fill(T.fits, { w: OW, h: OH }))}</span>` : `<span class="no">${esc(fill(T.sticks, { w: OW, h: OH }))}</span>`);

    function lessonState() { return treeSeg(cx.au.currentTime).cur; }
    function freeStart() {
      const st = lessonState();

      cx.readout.innerHTML = describe(st, "");
    }
    let freeRaf = 0;
    function animateFree() {
      cancelAnimationFrame(freeRaf);
      const step = () => { if (!cx.FREE) return; cx.render(); if (performance.now() - cx.FREE.t0 < DUR_FREE + 30) freeRaf = requestAnimationFrame(step); };

    }
    function apply(next, msg) {
      const F = cx.FREE;
      grow(next);
      F.prev = F.cur; F.cur = next; F.t0 = performance.now(); F.sel = null;
      cx.readout.innerHTML = describe(next, msg);

    function findNode(root, id) { if (!root) return null; if (root.id === id) return root; return findNode(root.left, id) || findNode(root.right, id); }

      const a = F.sel;

      if (mode === "swap") {
        const root = cloneTree(st.root);
        (function rec(n) { if (!n) return; if (n.id === a) n.id = id; else if (n.id === id) n.id = a; rec(n.left); rec(n.right); })(root);

        if (cx.FREE) { cx.FREE.sel = null; cx.render(); }
      }));
      const rs = cx.root.querySelector('[data-act="fp-reset"]');
      if (rs) rs.addEventListener("click", () => { if (!cx.FREE) freeStart(); else apply(cx.FREE.start, ""); });

    function boxes(s, kx, ky, cam) {
      const out = [];
      if (!lastG) return out;
      const op = (el) => +(el.style.opacity === "" ? 1 : el.style.opacity);
      if (op(gTree) >= 0.6) IDS.forEach((id) => {

      },

  };

  window.LessonEngine = { mount, parseTree, packTree, treeStr };
})();
